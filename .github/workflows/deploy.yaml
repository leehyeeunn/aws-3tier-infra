name: CI/CD Pipeline to ECR and EC2

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::904233134125:role/github-actions-ecr-role
        aws-region: ap-northeast-2

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Docker image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: fastapi-app
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
        docker push $REGISTRY/$REPOSITORY:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Private EC2 via Bastion Jump
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.APP_PRIVATE_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        proxy_host: ${{ secrets.BASTION_HOST }}
        proxy_username: ubuntu
        proxy_key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. AWS 자격 증명 환경에서 ECR 토큰 발급 및 Docker 로그인
          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO_URI }}
          
          # 2. 최신 컨테이너 이미지 Pull
          docker pull ${{ secrets.ECR_REPO_URI }}:latest
          
          # 3. 기존 컨테이너 안전 종료 및 제거
          docker stop my-fastapi-app || true
          docker rm my-fastapi-app || true
          
          # 4. 새 도커 컨테이너 백그라운드 구동 (--restart always 자가 치유)
          docker run -d -p 8000:8000 --name my-fastapi-app --restart always ${{ secrets.ECR_REPO_URI }}:latest
          
          # 5. 내부 헬스체크 검증
          sleep 3
          curl -f http://localhost:8000/health