name: CI/CD Pipeline to ECR and EC2

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::904233134125:role/github-actions-ecr-role
        aws-region: ap-northeast-2

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Docker image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: fastapi-app
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
        docker push $REGISTRY/$REPOSITORY:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS Credentials for Runner
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::904233134125:role/github-actions-ecr-role
        aws-region: ap-northeast-2

    - name: Deploy Image to Private EC2 via Bastion Tunnel
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.BASTION_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. 인터넷이 되는 Bastion에서 ECR 로그인 및 이미지 다운로드
          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO_URI }}
          docker pull ${{ secrets.ECR_REPO_URI }}:latest
          
          # 2. 이미지를 tar 파일로 저장
          docker save ${{ secrets.ECR_REPO_URI }}:latest -o /tmp/app-latest.tar
          
          # 3. 내부 사설망을 통해 Private EC2로 전송 및 컨테이너 교체
          scp -o StrictHostKeyChecking=no /tmp/app-latest.tar ubuntu@${{ secrets.APP_PRIVATE_IP }}:/tmp/
          
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.APP_PRIVATE_IP }} << 'EOF'
            docker load -i /tmp/app-latest.tar
            docker stop my-fastapi-app || true
            docker rm my-fastapi-app || true
            docker run -d -p 8000:8000 --name my-fastapi-app --restart always ${{ secrets.ECR_REPO_URI }}:latest
            sleep 3
            curl -f http://localhost:8000/health
          EOF
          
          # 임시 파일 정리
          rm -f /tmp/app-latest.tar