name: Build and Push Docker to ECR

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Inspect OIDC Token Claims
      run: |
        # GitHub Actions 내부 OIDC 토큰 요청
        TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
        
        # JWT 토큰의 2번째 파트(Payload)를 Base64 디코딩하여 JSON 출력
        echo "=== Decoded OIDC Payload ==="
        echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq . || true

    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::904233134125:role/github-actions-ecr-role
        aws-region: ap-northeast-2